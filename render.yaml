services:
  # Banco de dados PostgreSQL
  - type: pserv
    name: help-desk-db
    plan: free
    postgresMajorVersion: 16

  # Backend API
  - type: web
    name: help-desk-api
    plan: free
    region: oregon
    runtime: node
    buildCommand: cd backend && npm install && npx prisma generate --schema=prisma/schema.prod.prisma && npm run build
    startCommand: cd backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: help-desk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
    healthCheckPath: /api/health
    autoDeploy: true

  # Frontend
  - type: web
    name: help-desk-frontend
    plan: free
    region: oregon
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://help-desk-api.onrender.com
    autoDeploy: true